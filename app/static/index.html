<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подсчёт мешков на конвейере</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e3e5ec;
    --text: #1a1c23;
    --muted: #6b7080;
    --accent: #4f5cf0;
    --accent-text: #ffffff;
    --ok-bg: #e6f7ed; --ok-text: #14803c; --ok-border: #b7ebc6;
    --warn-bg: #fff4e0; --warn-text: #93600a; --warn-border: #ffdca3;
    --err-bg: #fdeaea; --err-text: #b3261e; --err-border: #f5c2bf;
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 4px 16px rgba(20, 20, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151b;
      --surface: #1c1e27;
      --border: #2c2f3a;
      --text: #eceef4;
      --muted: #9195a6;
      --ok-bg: #133223; --ok-text: #4ade80; --ok-border: #1f4d34;
      --warn-bg: #3a2c0f; --warn-text: #fbbf24; --warn-border: #5a4419;
      --err-bg: #3a1a1a; --err-text: #f87171; --err-border: #5c2626;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  h2 { font-size: 1.02rem; font-weight: 600; margin: 0 0 1rem; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
  }
  button:hover:not(:disabled) { opacity: 0.9; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.ghost {
    background: transparent;
    color: var(--muted);
    padding: 0.25rem 0.5rem;
    font-size: 1rem;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    margin-bottom: 1rem;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .dropzone .icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
  .dropzone .hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .dropzone .filename { font-weight: 600; margin-top: 0.4rem; }
  input[type="file"] { display: none; }

  .row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .field { margin: 0.55rem 0; display: flex; justify-content: space-between; gap: 1rem; }
  .field .label { color: var(--muted); font-size: 0.85rem; }
  .field .value { font-weight: 600; text-align: right; }
  .field code.value { font-weight: 500; font-size: 0.8rem; }

  progress { width: 100%; height: 8px; border-radius: 4px; overflow: hidden; appearance: none; border: none; }
  progress::-webkit-progress-bar { background: var(--border); border-radius: 4px; }
  progress::-webkit-progress-value { background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }
  progress::-moz-progress-bar { background: var(--accent); border-radius: 4px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-pending, .badge-processing { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .badge-completed { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
  .badge-failed { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }

  .callout {
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    margin-top: 0.85rem;
    font-size: 0.88rem;
    border: 1px solid;
  }
  .callout-error { background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }
  .callout-warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }

  .anomaly-banner {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    background: var(--warn-bg);
    color: var(--warn-text);
    border: 1px solid var(--warn-border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
    box-shadow: var(--shadow);
  }

  ul.anomalies { margin: 0.4rem 0 0; padding-left: 1.1rem; }
  ul.anomalies li { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }

  ul.job-list { list-style: none; margin: 0; padding: 0; }
  ul.job-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  ul.job-list li:last-child { border-bottom: none; }
  ul.job-list .job-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  ul.job-list .job-filename { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.job-list .job-meta { font-size: 0.78rem; color: var(--muted); }

  .muted { color: var(--muted); font-size: 0.9rem; }
  code { background: color-mix(in srgb, var(--muted) 15%, transparent); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
  .spinner {
    display: inline-block;
    width: 0.85em; height: 0.85em;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -0.15em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>📦 Подсчёт мешков на конвейере</h1>
  <p>Загрузите видео с конвейера — сервис найдёт мешки и посчитает их.</p>
</header>

<div id="anomaly-banner" class="anomaly-banner" hidden>
  <span id="anomaly-banner-text"></span>
  <button id="anomaly-banner-dismiss" class="ghost" title="Скрыть">&times;</button>
</div>

<section id="upload-section">
  <h2>Загрузка видео</h2>
  <label class="dropzone" id="dropzone" for="file-input">
    <div class="icon">🎞️</div>
    <div>Перетащите видео сюда или нажмите, чтобы выбрать файл</div>
    <div class="hint">MP4 и другие распространённые форматы</div>
    <div class="filename" id="selected-filename"></div>
  </label>
  <input type="file" id="file-input" accept="video/*">
  <div class="row">
    <button id="upload-btn" disabled>Загрузить</button>
  </div>
  <div id="upload-error" class="callout callout-error" hidden></div>
</section>

<section id="job-section" hidden>
  <h2>Текущее задание</h2>
  <div class="field"><span class="label">Файл</span><span id="job-filename" class="value"></span></div>
  <div class="field"><span class="label">ID</span><code id="job-id" class="value"></code></div>
  <div class="field"><span class="label">Статус</span><span id="job-status" class="value"></span></div>

  <div class="row" style="margin: 1rem 0;">
    <button id="process-btn">Начать обработку</button>
  </div>

  <div id="progress-wrap" hidden>
    <progress id="progress-bar" max="1" value="0"></progress>
    <div class="muted" id="progress-text" style="margin-top: 0.3rem;"></div>
  </div>

  <div class="field"><span class="label">Мешков посчитано</span><span id="bag-count" class="value">0</span></div>

  <div id="anomalies-wrap" hidden>
    <div class="label muted">Аномалии за время обработки:</div>
    <ul id="anomalies-list" class="anomalies"></ul>
  </div>

  <div id="job-error" class="callout callout-error" hidden></div>

  <div class="row" style="margin-top: 1rem;">
    <a id="download-link" href="#" hidden><button>⬇ Скачать результат</button></a>
  </div>
</section>

<section>
  <div class="row" style="justify-content: space-between; margin-bottom: 1rem;">
    <h2 style="margin: 0;">Недавние задания</h2>
    <button class="ghost" id="refresh-jobs-btn" title="Обновить">⟳</button>
  </div>
  <ul id="job-list" class="job-list"></ul>
  <p id="no-jobs" class="muted">Пока нет загруженных видео.</p>
</section>

<script>
const API = "";
const POLL_INTERVAL_MS = 2000;
const STATUS_LABELS = {
  pending: "ожидает", processing: "обрабатывается", completed: "готово", failed: "ошибка",
};
const ANOMALY_LABELS = {
  reverse_direction: "Обратное движение",
  detection_gap: "Нет объектов в кадре",
};

let currentJobId = null;
let pollTimer = null;
const seenAnomalyCounts = {}; // jobId -> how many anomalies we've already notified about

const el = (id) => document.getElementById(id);

function statusBadge(status) {
  const span = document.createElement("span");
  span.className = "badge badge-" + status;
  span.textContent = STATUS_LABELS[status] || status;
  return span;
}

function notifyNewAnomalies(job) {
  const anomalies = job.anomalies || [];
  const seen = seenAnomalyCounts[job.id];
  // Not seeded yet for this job (shouldn't normally happen — showJob()
  // seeds it — but fail safe rather than treat pre-existing anomalies as
  // "new" the first time we somehow render without seeding).
  if (seen === undefined) return;
  if (anomalies.length <= seen) return;

  const newOnes = anomalies.slice(seen);
  seenAnomalyCounts[job.id] = anomalies.length;

  const latest = newOnes[newOnes.length - 1];
  const banner = el("anomaly-banner");
  const label = ANOMALY_LABELS[latest.kind] || latest.kind;
  const suffix = newOnes.length > 1 ? ` (+${newOnes.length - 1})` : "";
  el("anomaly-banner-text").textContent = `⚠ ${label}: ${latest.message}${suffix}`;
  banner.hidden = false;
}

async function apiFetch(path, options) {
  const resp = await fetch(API + path, options);
  if (!resp.ok) {
    let detail = resp.statusText;
    try {
      const body = await resp.json();
      detail = body.detail || detail;
    } catch {}
    throw new Error(detail);
  }
  return resp.json();
}

// --- upload ---

const dropzone = el("dropzone");
const fileInput = el("file-input");

function setSelectedFile(file) {
  el("selected-filename").textContent = file ? file.name : "";
  el("upload-btn").disabled = !file;
}

fileInput.addEventListener("change", () => setSelectedFile(fileInput.files[0]));
["dragover", "dragenter"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dragover"); })
);
["dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dragover"); })
);
dropzone.addEventListener("drop", (e) => {
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    setSelectedFile(fileInput.files[0]);
  }
});

async function uploadVideo() {
  const errorBox = el("upload-error");
  errorBox.hidden = true;

  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  const btn = el("upload-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Загрузка…';
  try {
    const job = await apiFetch("/videos", { method: "POST", body: formData });
    showJob(job);
    fileInput.value = "";
    setSelectedFile(null);
    refreshJobList();
  } catch (err) {
    errorBox.textContent = "Ошибка загрузки: " + err.message;
    errorBox.hidden = false;
  } finally {
    btn.disabled = !fileInput.files.length;
    btn.textContent = "Загрузить";
  }
}

// --- current job ---

async function startProcessing() {
  el("process-btn").disabled = true;
  try {
    const job = await apiFetch(`/videos/${currentJobId}/process`, { method: "POST" });
    renderJob(job);
    startPolling();
    refreshJobList();
  } catch (err) {
    el("job-error").textContent = "Ошибка запуска обработки: " + err.message;
    el("job-error").hidden = false;
    el("process-btn").disabled = false;
  }
}

function openJob(jobId) {
  stopPolling();
  currentJobId = jobId;
  apiFetch(`/videos/${jobId}/status`)
    .then((job) => {
      showJob(job);
      if (job.status === "pending" || job.status === "processing") startPolling();
    })
    .catch((err) => {
      el("job-error").textContent = "Не удалось получить статус: " + err.message;
      el("job-error").hidden = false;
    });
}

function showJob(job) {
  currentJobId = job.id;
  el("job-section").hidden = false;
  el("anomaly-banner").hidden = true; // banner belongs to whichever job was showing before
  // Mark whatever anomalies this job already has as "seen" the moment we
  // open it — the banner is for anomalies detected *while watching*
  // (during polling), not a retroactive alert for a job's whole history
  // just because you opened it.
  seenAnomalyCounts[job.id] = (job.anomalies || []).length;
  renderJob(job);
  el("job-section").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderJob(job) {
  el("job-id").textContent = job.id;
  el("job-filename").textContent = job.filename;

  const statusEl = el("job-status");
  statusEl.innerHTML = "";
  statusEl.append(statusBadge(job.status));

  el("bag-count").textContent = job.bag_count;

  const processBtn = el("process-btn");
  processBtn.disabled = job.status !== "pending";
  processBtn.textContent = job.status === "pending" ? "Начать обработку" : "Обработка запущена";

  const progressWrap = el("progress-wrap");
  if (job.status === "processing") {
    progressWrap.hidden = false;
    el("progress-bar").value = job.progress;
    el("progress-text").textContent = Math.round(job.progress * 100) + "%";
  } else {
    progressWrap.hidden = true;
  }

  const anomaliesWrap = el("anomalies-wrap");
  if (job.anomalies && job.anomalies.length > 0) {
    anomaliesWrap.hidden = false;
    const list = el("anomalies-list");
    list.innerHTML = "";
    for (const a of job.anomalies) {
      const li = document.createElement("li");
      li.textContent = `[${a.timestamp_sec.toFixed(1)}s, кадр ${a.frame}] ${a.kind}: ${a.message}`;
      list.append(li);
    }
  } else {
    anomaliesWrap.hidden = true;
  }
  notifyNewAnomalies(job);

  const errorBox = el("job-error");
  if (job.status === "failed" && job.error) {
    errorBox.textContent = job.error;
    errorBox.hidden = false;
  } else {
    errorBox.hidden = true;
  }

  const downloadLink = el("download-link");
  if (job.status === "completed") {
    downloadLink.href = `/videos/${job.id}/download`;
    downloadLink.hidden = false;
  } else {
    downloadLink.hidden = true;
  }
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    try {
      const job = await apiFetch(`/videos/${currentJobId}/status`);
      renderJob(job);
      if (job.status === "completed" || job.status === "failed") {
        stopPolling();
        refreshJobList();
      }
    } catch (err) {
      stopPolling();
      el("job-error").textContent = "Не удалось получить статус: " + err.message;
      el("job-error").hidden = false;
    }
  }, POLL_INTERVAL_MS);
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// --- job list (server-backed — jobs persist across restarts, so this
// always reflects what's actually recoverable, unlike a client-only list) ---

async function refreshJobList() {
  let jobs;
  try {
    jobs = await apiFetch("/videos?limit=20");
  } catch {
    return; // leave whatever was last rendered rather than clearing it on a transient error
  }

  const list = el("job-list");
  list.innerHTML = "";
  el("no-jobs").hidden = jobs.length > 0;

  for (const job of jobs) {
    const li = document.createElement("li");

    const info = document.createElement("div");
    info.className = "job-info";
    const name = document.createElement("span");
    name.className = "job-filename";
    name.textContent = job.filename;
    const meta = document.createElement("span");
    meta.className = "job-meta";
    meta.textContent = new Date(job.created_at).toLocaleString("ru-RU");
    info.append(name, meta);

    const right = document.createElement("div");
    right.className = "row";
    right.append(statusBadge(job.status));
    const btn = document.createElement("button");
    btn.className = "secondary";
    btn.textContent = "Открыть";
    btn.onclick = () => openJob(job.id);
    right.append(btn);

    li.append(info, right);
    list.append(li);
  }
}

el("upload-btn").addEventListener("click", uploadVideo);
el("process-btn").addEventListener("click", startProcessing);
el("anomaly-banner-dismiss").addEventListener("click", () => { el("anomaly-banner").hidden = true; });
el("refresh-jobs-btn").addEventListener("click", refreshJobList);

refreshJobList();
</script>

</body>
</html>
