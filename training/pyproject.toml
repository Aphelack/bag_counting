[project]
name = "bag-counting-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Pinned to a version OpenMMLab actually publishes prebuilt mmcv wheels
    # for (their index tops out around torch 2.7/cu128 as of writing — mmcv
    # development has slowed a lot, see experiments/README.md). Leaving
    # this unpinned lets uv resolve the latest torch/CUDA build, which mim
    # then can't find a matching mmcv wheel for and falls back to building
    # mmcv from source — which fails on its own for unrelated reasons (see
    # the setuptools pin below).
    "torch==2.1.2",
    "torchvision==0.16.2",
    "openmim>=0.3.9",
    # openmim's CLI imports pkg_resources (from setuptools) but doesn't
    # declare it as a dependency — uv venvs don't bundle setuptools by
    # default the way classic `venv` does, so `mim` fails with
    # "ModuleNotFoundError: No module named 'pkg_resources'" without this.
    # Also pinned <81: setuptools removed pkg_resources entirely in 81/82
    # (Feb 2026), which breaks the same import even with setuptools present.
    "setuptools<81",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.8",  # not 3.11.1 like experiments/ — that needs Python>=3.11, this project allows 3.10
    "pillow>=12.3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
