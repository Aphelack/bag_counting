[project]
name = "bag-counting-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "openmim>=0.3.9",
    # openmim's CLI imports pkg_resources (from setuptools) but doesn't
    # declare it as a dependency — uv venvs don't bundle setuptools by
    # default the way classic `venv` does, so `mim` fails with
    # "ModuleNotFoundError: No module named 'pkg_resources'" without this.
    # Also pinned <81: setuptools removed pkg_resources entirely in 81/82
    # (Feb 2026), which breaks the same import even with setuptools present.
    "setuptools<81",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2.0",
]
