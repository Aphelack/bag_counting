services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data
      - ./models:/models
    environment:
      - DATA_DIR=/data
      - DETECTOR_CONFIG_PATH=/models/rtmdet_bag.py
      - DETECTOR_CHECKPOINT_PATH=/models/checkpoint.pth
      - DETECTOR_DEVICE=cuda:0
      # Frames per batched inference call. RTMDet-tiny is a small model
      # (inference-only, no gradients kept), so 64 has real headroom left
      # on an A100 — watch `nvidia-smi` during a run and push higher
      # (128+) if utilization/memory still has room. Lower it (e.g. 4-8)
      # on a smaller/consumer GPU if you hit out-of-memory errors.
      - DETECTION_BATCH_SIZE=64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
